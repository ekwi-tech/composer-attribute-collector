# git-cliff configuration — https://git-cliff.org/docs/configuration
# Generates release notes from Conventional Commits.
# Types in commit_parsers with skip=true are excluded from release notes
# (internal concerns: ci, chore, test, style, docs, build).

# One output: the release body, the delta since the last tag.
#
#   git-cliff --unreleased --tag vX.Y.Z --strip all
#
# --strip all drops the header, leaving this version's section alone. The `## [X.Y.Z] — date` line it keeps
# is not noise: it dates the release, which the GitHub Release page does not. Full history is the /releases
# page, one such delta per entry.
[changelog]
header = """
# Changelog

Generated by git-cliff from Conventional Commits at release time. Do not edit by hand — the next release
overwrites it.
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] — {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}

{% for commit in commits %}\
- {% if commit.breaking %}**BREAKING** {% endif %}{{ commit.message | upper_first }} \
([`{{ commit.id | truncate(length=7, end="") }}`](https://github.com/ekwi-tech/composer-attribute-collector/commit/{{ commit.id }}))
{% endfor %}
{% endfor %}
"""
trim = true
footer = ""

# No [remote.github] section on purpose: it makes git-cliff call the GitHub API to enrich notes with
# PR/contributor data, and on a PRIVATE repo that call returns 403 without a token and git-cliff panics.
# The changelog body uses only commit id/message with a hard-coded commit URL, so remote enrichment brings
# nothing. To add PR links later: re-add [remote.github] AND pass GITHUB_TOKEN to the git-cliff step.

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_preprocessors = []
commit_parsers = [
  { message = "^feat",     group = "Features"      },
  { message = "^fix",      group = "Bug Fixes"      },
  { message = "^perf",     group = "Performance"    },
  { message = "^refactor", group = "Refactoring"    },
  { message = "^docs|^style|^test|^chore|^ci|^build", skip = true },
]
protect_breaking_commits = true
filter_commits = true
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
