# Monthly synchronization with the upstream project.
#
# This fork carries a small number of proprietary commits on top of
# olvlvl/composer-attribute-collector (e.g. the CollectableAttribute feature).
# Because the history has diverged, upstream cannot be fast-forwarded: it must be
# merged and reviewed. This workflow never merges automatically — it only prepares
# a branch pointing at upstream/main and opens a pull request, so a human reviews
# and resolves conflicts (if any) through GitHub's native merge UI.
#
# Design rationale:
#   - The sync branch is a plain copy of upstream/main. Opening a PR into the
#     default branch makes GitHub compute a 3-way merge from the common ancestor,
#     which means the fork's own commits are preserved and the PR diff shows only
#     the genuinely new upstream changes.
#   - No merge is performed inside the runner, so conflict markers are never
#     committed. Conflicts, when they exist, surface in the PR and are resolved
#     with `gh pr checkout` (or the web editor).
#
# Authentication:
#   The branch push and the PR are performed with a GitHub App installation token,
#   not the default GITHUB_TOKEN. This is deliberate: pushes made with GITHUB_TOKEN
#   do NOT trigger other workflows (GitHub's anti-recursion rule), so the CI
#   (`cases`/`quality`/`test`, all `on: push`) would never run on the sync branch.
#   A push authenticated by the App is seen as a real actor and DOES trigger CI,
#   which lets those checks be enforced as required status checks on the sync PR.
#
#   Required repository secrets (from the shared "ekwi-ci-bot" GitHub App):
#     - CI_APP_CLIENT_ID   : the GitHub App's Client ID (preferred over App ID)
#     - CI_APP_PRIVATE_KEY : the App's private key (.pem contents)
#   Required App repository permissions:
#     - Contents: read/write, Pull requests: read/write, Workflows: read/write
name: _Ekwi — Sync upstream

on:
  schedule:
    # 06:00 UTC on the 1st day of every month.
    - cron: "0 6 1 * *"
  # Allow running the sync on demand from the Actions tab.
  workflow_dispatch:

# The default GITHUB_TOKEN is read-only here; all writes go through the App token.
permissions:
  contents: read

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM_REPO: https://github.com/olvlvl/composer-attribute-collector.git
  UPSTREAM_BRANCH: main
  SYNC_BRANCH: chore/upstream-sync
  # This fork's default branch, i.e. the PR base. Set explicitly rather than read
  # from `github.event.repository.default_branch`, which is empty on `schedule`
  # events (the primary trigger) and would break `gh pr create --base`.
  BASE_BRANCH: main

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          # `app-id` accepts the App's Client ID (recommended) as well as the
          # numeric App ID; we pass the Client ID.
          app-id: ${{ secrets.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}

      - name: Checkout fork
        uses: actions/checkout@v6
        with:
          # Full history is required to compute the divergence with upstream.
          fetch-depth: 0
          # Use the App token so the subsequent push is attributed to the App
          # and triggers the CI workflows on the sync branch.
          token: ${{ steps.app-token.outputs.token }}

      - name: Fetch upstream
        run: |
          git remote add upstream "$UPSTREAM_REPO" 2>/dev/null \
            || git remote set-url upstream "$UPSTREAM_REPO"
          git fetch --tags upstream "$UPSTREAM_BRANCH"

      - name: Detect new upstream commits
        id: check
        run: |
          new_commits="$(git rev-list --count HEAD..upstream/${UPSTREAM_BRANCH})"
          echo "new_commits=${new_commits}" >> "$GITHUB_OUTPUT"
          if [ "$new_commits" -eq 0 ]; then
            echo "Already up to date with upstream/${UPSTREAM_BRANCH}. Nothing to do."
          else
            echo "Upstream is ahead by ${new_commits} commit(s)."
          fi

      - name: Push sync branch
        if: steps.check.outputs.new_commits != '0'
        run: |
          # Point the sync branch at upstream/main. Force-update is intentional:
          # it keeps the branch (and any open sync PR) tracking the latest upstream.
          git push --force origin \
            "refs/remotes/upstream/${UPSTREAM_BRANCH}:refs/heads/${SYNC_BRANCH}"

      - name: Open pull request
        if: steps.check.outputs.new_commits != '0'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          # Reuse the existing PR if one is already open for the sync branch.
          existing="$(gh pr list --head "$SYNC_BRANCH" --state open \
            --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "PR #${existing} already open; the branch has been updated."
            exit 0
          fi

          cat > pr-body.md <<'EOF'
          ## Monthly upstream synchronization

          This PR merges the latest changes from
          [`olvlvl/composer-attribute-collector`](https://github.com/olvlvl/composer-attribute-collector)
          (branch `main`) into this fork.

          - The fork's own commits are preserved (GitHub computes a 3-way merge from
            the common ancestor); the diff below shows only the new upstream changes.
          - **Merge strategy:** use a **merge commit** to keep upstream history and the
            shared ancestor intact for future syncs.
          - The `chore/upstream-sync` branch is bot-owned and force-updated on the next
            monthly run. If GitHub reports conflicts, resolve and merge **promptly**
            (`gh pr checkout <this-PR>` → fix → merge) rather than leaving commits on it.

          _Generated by the `Sync upstream` workflow._
          EOF

          # Create the PR once, then attach the label best-effort. Creating with
          # `--label` for a possibly-missing label can, depending on the gh version,
          # open the PR and only then fail — risking a duplicate on a naive retry.
          url="$(gh pr create \
            --base "$BASE_BRANCH" \
            --head "$SYNC_BRANCH" \
            --title "chore: sync upstream ($(date -u +%Y-%m))" \
            --body-file pr-body.md)"
          echo "Opened ${url}"
          gh pr edit "$url" --add-label upstream-sync 2>/dev/null \
            || echo "Label 'upstream-sync' not applied (missing label or permission); ignoring."
