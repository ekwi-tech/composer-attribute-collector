# Cut a release of this Composer package. A Composer package is published by its GIT TAG — Packagist and any
# `type: vcs` entry resolve versions from the tags, so there is no registry to deploy to.
#
# The release orchestration lives once in ekwi-tech/release-workflow (pinned by SHA); this is the thin caller,
# carrying only what is specific to this repo: the first-release version and which CI workflows gate a tag.
name: _Ekwi — Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Release channel — pre-release cuts X.Y.Z-beta.N, latest cuts a stable X.Y.Z.'
        required: true
        default: pre-release
        type: choice
        options:
          - pre-release
          - latest

permissions: {}

# No concurrency block — the "one release at a time" guard is centralised in the reusable workflow.
jobs:
  release:
    # The caller owns the token scope; the reusable declares none and inherits this grant.
    permissions:
      contents: write        # create the tag + the GitHub Release
      actions: read          # green-build gate reads CI conclusions
      pull-requests: read    # release notes resolve each commit's PR author/number
    uses: ekwi-tech/release-workflow/.github/workflows/composer-release-reusable.yml@3a2ab006e42c39c3bcf82aceeca0512039413285 # v0.1.0
    with:
      channel: ${{ inputs.channel }}
      # First release only (no tag yet). 2.2.0 keeps semver continuity with upstream olvlvl v2.1.2 + the
      # CollectableAttribute feature, so a consumer's `^2.2` resolves cleanly.
      initial-version: '2.2.0'
      # Gate on the workflows that test OUR code. cases.yml is deliberately EXCLUDED: it installs pinned
      # third-party fixtures (Symfony, Laravel) whose deps drift under external advisories, so it goes red for
      # reasons unrelated to this package — gating on it would let an upstream advisory freeze our releases.
      ci-workflows: 'test.yml quality.yml'
