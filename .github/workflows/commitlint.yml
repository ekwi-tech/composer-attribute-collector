name: Semantic PR Title

# The release notes (git-cliff) and the derived version (next-version-action) read Conventional Commits.
# This check enforces a Conventional Commit PR title so every merged change is classifiable: keep the
# individual commits conventional too, or squash to the title. (The upstream-sync PR title
# `chore: sync upstream (...)` is conventional all the same.)
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  validate-pr-title:
    name: Enforce Conventional Commits format on PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Allowed commit types — mirrors cliff.toml commit_parsers.
          types: |
            feat
            fix
            perf
            refactor
            build
            chore
            ci
            docs
            style
            test
          requireScope: false
